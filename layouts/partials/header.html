<nav class="page__nav main-nav">
    <ul>
      <li class="nomarker">
        <h1 class="page__logo">
            <a href="{{ .Site.BaseURL }}" class="page__logo-inner">{{ .Site.Title }}<span class="page__logo-suffix">&nbsp;$&nbsp;<span class="logo-clover" aria-hidden="true">&#9827;</span></span><span class="cursor" aria-hidden="true"></span></a>
        </h1>
      </li>
    {{ $currentPage := . }}
    {{ range .Site.Menus.main }}
    <li class="main-nav__item"><a class="nav-main-item{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) (eq ($currentPage.Permalink) (.URL | absLangURL)) }} active{{end}}" href="{{ .URL | absLangURL }}" title="{{ .Title }}">{{ .Name }}</a></li>
    {{ end }}
    </ul>
</nav>
