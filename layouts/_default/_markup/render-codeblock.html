{{- $lang := .Type -}}
{{- $result := transform.HighlightCodeBlock . -}}
<div class="code-block">
  <div class="code-block__header">
    <span class="code-block__meta">
      <span class="code-block__dots"><span></span><span></span><span></span></span>
      {{- with $lang }}<span class="code-block__lang">{{ . }}</span>{{ end -}}
    </span>
    <button class="code-block__copy" type="button" aria-label="Copy code to clipboard">
      <span class="code-block__copy-label">copy</span>
    </button>
  </div>
  <div class="code-block__body">
    <pre class="chroma">{{ $result.Inner }}</pre>
  </div>
</div>
